# pnpm 11+ reads build-script approval from here (pnpm 11 ignores the
# package.json "pnpm" field; package.json keeps onlyBuiltDependencies for
# pnpm 10 CI). esbuild is used by zfb's bundler; sharp backs image probing;
# workerd backs the Cloudflare adapter build; lefthook's postinstall fetches
# its platform binary.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
# pnpm 11.5.2's default minimumReleaseAge gate (~24h cooldown) rejects packages
# published within the cutoff, and CI's `pnpm install --frozen-lockfile` enforces
# it (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). These first-party @takazudo packages
# were published the same day as this bump, so each adopted version must be
# explicitly approved here or CI fails. pnpm regenerates this list on the next bump.
minimumReleaseAgeExclude:
  - '@takazudo/zfb-adapter-cloudflare@2.5.1'
  - '@takazudo/zfb-darwin-arm64@2.5.1'
  - '@takazudo/zfb-darwin-x64@2.5.1'
  - '@takazudo/zfb-linux-arm64-gnu@2.5.1'
  - '@takazudo/zfb-linux-x64-gnu@2.5.1'
  - '@takazudo/zfb-md-wasm@2.5.1'
  - '@takazudo/zfb-runtime@2.5.1'
  - '@takazudo/zfb-win32-x64-msvc@2.5.1'
  - '@takazudo/zfb@2.5.1'
  - '@takazudo/zudo-doc-history-server@5.5.1'
  - '@takazudo/zudo-doc@5.5.1'
