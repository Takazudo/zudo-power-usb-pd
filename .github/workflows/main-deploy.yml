name: Production Deploy (Cloudflare Workers)

# Builds the zudo-doc site in /doc and deploys it to Cloudflare Workers
# (static assets) on every push to main.
#
# Build -> generated-component drift check -> deploy gate -> publish. The
# drift check pair (committed-and-up-to-date + deterministic) mirrors the
# regen-idempotency contract component-spec-skills.yml enforces for the
# boards/ schematics, so a stale doc/src/content/docs/components/ page can
# never reach the live site.
#
# The deploy is GUARDED: it runs only when BOTH Cloudflare secrets are present
# AND the wrangler.toml domain placeholder has been replaced. Until then the
# job still builds + typechecks + drift-checks (so merges to main stay green)
# but skips the actual publish. See doc/wrangler.toml and the Cloudflare
# go-live checklist in doc/CLAUDE.md.

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: doc
    steps:
      # SHA-pinned like component-spec-skills.yml (same checkout pin) — a
      # mutable tag is a supply-chain hole. Verified against the real tags:
      # checkout v5.0.1, pnpm/action-setup v4.4.0, setup-node v4.4.0.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history so the doc-history plugin's preBuild can populate the
          # Created/Updated/Author meta block (and, in CI, the per-page history
          # JSON via postBuild — auto-enabled when GITHUB_ACTIONS is set).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: doc/pnpm-lock.yaml

      # `pnpm build` runs `generate:components` first, which shells out to the
      # component-spec validator (python3). Pinned to the same 3.12 as
      # component-spec-skills.yml so the two never disagree, rather than
      # relying on whatever the runner image happens to ship.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Footprint previews are current and safe
        run: pnpm check:footprint-previews

      - name: Published package models are safe and up to date
        run: pnpm check:models

      - name: Build (emits dist/_worker.js via the Cloudflare adapter)
        run: pnpm build

      - name: Built component references are complete and minimal
        run: pnpm check:built-component-references

      # THE drift authority for every committed generated file. `pnpm build`
      # rewrites doc/src/content/docs/components/ AND
      # doc/component-docs/preflight.json via generate:components; a source
      # edit under .claude/skills/, a CLAUDE.md, or the generator itself that
      # lands without a rebuild leaves the committed output stale, and this
      # fails the deploy instead of publishing a stale site. The preview-asset
      # tree is included too — check:footprint-previews / check:models above
      # verify hashes against the committed manifest, but nothing before this
      # step proves the SVG/WRL bytes themselves are the ones actually
      # committed, so a stale preview asset would otherwise reach the live
      # site undetected.
      # `--intent-to-add` is required: a newly generated page arrives
      # UNTRACKED, and `git diff` cannot see untracked files on its own.
      - name: Generated output is committed and up to date
        working-directory: ${{ github.workspace }}
        run: |
          git add --intent-to-add -A -- doc/src/content/docs doc/component-docs/preflight.json doc/public/assets/component-previews
          git diff --exit-code -- doc/src/content/docs doc/component-docs/preflight.json doc/public/assets/component-previews

      # The SECOND generation run: `build` projected and wrote the tree, this
      # re-projects from the evidence and proves the result byte-identical.
      # Run-to-run nondeterminism would otherwise surface as an intermittent
      # diff on some unrelated push; here it fails where it is caused.
      - name: Component generation is deterministic
        run: pnpm check:components

      # Artifact-level denied-value scan over dist/: everything upstream
      # proves the view model is clean, but the MDX compiler, minifier and
      # indexers between the model and these bytes are framework-owned. This
      # is the wiring for component-docs/core/scan.ts.
      - name: No denied evidence value reaches the built site
        run: pnpm scan:components

      - name: Evaluate deploy gate
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          should=true
          reason=""
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            should=false
            reason="CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret(s) not set"
          elif grep -q 'REPLACE_ME' wrangler.toml; then
            should=false
            reason="wrangler.toml still has the REPLACE_ME domain placeholder"
          fi
          echo "should_deploy=$should" >> "$GITHUB_OUTPUT"
          if [ "$should" != "true" ]; then
            echo "::notice::Skipping Cloudflare deploy — $reason. Build + typecheck ran; the site was NOT published. Complete the go-live checklist in doc/CLAUDE.md to enable deploys."
          fi

      - name: Prepare deploy artifact
        if: steps.gate.outputs.should_deploy == 'true'
        run: |
          # Exclude the worker entry + sidecar from the public asset directory so
          # they are not served as downloadable files (documented in wrangler.toml).
          printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy to Cloudflare Workers (production)
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          n=0
          until [ "$n" -ge 3 ]; do
            npx wrangler@4 deploy --env production 2>&1 | tee deploy.log && break
            n=$((n + 1))
            echo "wrangler deploy failed (attempt $n/3); retrying in 10s..."
            sleep 10
          done
          [ "$n" -lt 3 ]
