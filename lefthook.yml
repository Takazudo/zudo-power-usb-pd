pre-commit:
  commands:
    format-mdx:
      glob: 'doc/src/content/docs/**/*.{md,mdx}'
      # Generated component-record pages (doc/component-docs/cli/generate.ts)
      # are byte-exact against `check:components`'s drift check. Formatting
      # them at commit time would drift them from the next `generate:components`
      # run and turn CI red on every PR touching the tree.
      exclude: 'doc/src/content/docs/components/**'
      stage_fixed: true
      run: ./scripts/mdx-format.sh --write {staged_files}

pre-push:
  commands:
    check-doc:
      run: |
        BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null)
        if [ "$BRANCH" = "main" ]; then
          echo "Running doc quality checks before pushing to main..."
          pnpm -C doc run check || exit 1
          echo "Quality checks passed!"
        fi
